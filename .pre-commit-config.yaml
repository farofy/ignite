# Formatting and lint for this repository, one config for every language present.
# Enforced in CI by .github/workflows/commit-lint.yml, which runs
# `pre-commit run --all-files`.
#
# Local note: a global git core.hooksPath, if set, bypasses a repo's .git/hooks,
# so `pre-commit install` does not fire on such a machine. CI is the gate. Run
# once by hand with: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.4.2
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json, javascript]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -ci]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
